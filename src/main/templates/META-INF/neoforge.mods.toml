modLoader="javafml"
loaderVersion="[4,)"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
credits="Inspired by the Quark backpack by Vazkii, WireSegal, MCVinnyq and Sully. Integrates Backpacked by MrCrayfish, and more."
description='''${mod_description}'''

[[mixins]]
config="${mod_id}.mixins.json"

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Optional: without it, the inventory gets the equipment panel but no backpack band
[[dependencies.${mod_id}]]
    modId="backpacked"
    type="optional"
    versionRange="[3.0.5,)"
    ordering="AFTER"
    side="BOTH"

# Backpacked's networking library, only needed alongside Backpacked
[[dependencies.${mod_id}]]
    modId="framework"
    type="optional"
    versionRange="[0.13.10,)"
    ordering="AFTER"
    side="BOTH"

# Optional: with it, Quark's own backpack (if enabled in Quark's config) is shown in the band when worn
[[dependencies.${mod_id}]]
    modId="quark"
    type="optional"
    versionRange="[4.1-485,)"
    ordering="AFTER"
    side="BOTH"

# Quark's library, only needed alongside Quark
[[dependencies.${mod_id}]]
    modId="zeta"
    type="optional"
    versionRange="[1.1-40,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="curios"
    type="optional"
    versionRange="[9.5.1,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="accessories"
    type="optional"
    versionRange="[1.1.0-beta.53,)"
    ordering="AFTER"
    side="BOTH"

# Optional: with it, spell books can be opened from the inventory with a right click
[[dependencies.${mod_id}]]
    modId="ars_nouveau"
    type="optional"
    versionRange="[5.13.2,)"
    ordering="AFTER"
    side="BOTH"

# Optional: with it, filters can be opened from the inventory with a right click
[[dependencies.${mod_id}]]
    modId="create"
    type="optional"
    versionRange="[6.0.10,)"
    ordering="AFTER"
    side="BOTH"

# Optional: with it, sacks can be opened from the inventory with a right click, and are shown in the band like shulker boxes
[[dependencies.${mod_id}]]
    modId="supplementaries"
    type="optional"
    versionRange="[1.21.1-3.9.9,)"
    ordering="AFTER"
    side="BOTH"

# Optional: with it, the inventory gets the Aether's accessories button on the player portrait
[[dependencies.${mod_id}]]
    modId="aether"
    type="optional"
    versionRange="[1.5.10,)"
    ordering="AFTER"
    side="BOTH"

# Optional, client only: with it, JEI's "+" button fills the inventory's crafting grid
[[dependencies.${mod_id}]]
    modId="jei"
    type="optional"
    versionRange="[19.51.0,)"
    ordering="NONE"
    side="CLIENT"

# Optional, client only: Mouse Tweaks is told which of the inventory's slots are on show
[[dependencies.${mod_id}]]
    modId="mousetweaks"
    type="optional"
    versionRange="[2.26.1,)"
    ordering="NONE"
    side="CLIENT"

# Optional, client only: with it, the inventory gets a button that opens the Field Guide
[[dependencies.${mod_id}]]
    modId="fieldguide"
    type="optional"
    versionRange="[1.21.0+1.21.1,)"
    ordering="NONE"
    side="CLIENT"

# Optional, client only: with it, the inventory gets a button that opens the FTB Quests quest book
[[dependencies.${mod_id}]]
    modId="ftbquests"
    type="optional"
    versionRange="[2101.1.36,)"
    ordering="NONE"
    side="CLIENT"
